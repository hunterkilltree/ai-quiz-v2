<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Retest</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px;background:#f5f5f7;color:#222}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px #0002}
.top{display:flex;justify-content:space-between;font-size:14px;color:#666;margin-bottom:8px}
.bar{height:6px;background:#ddd;border-radius:3px;margin-bottom:12px}
.bar div{height:100%;background:#4a7bd0;border-radius:3px}
button.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:2px solid #ddd;border-radius:10px;background:#fff;font-size:15px;cursor:pointer}
button.opt.ok{border-color:#2e9e5b;background:#e6f6ec}
button.opt.bad{border-color:#d33;background:#fde8e8}
button.opt:disabled{cursor:default}
#next,#restart{margin-top:10px;padding:12px 20px;border:0;border-radius:10px;background:#4a7bd0;color:#fff;font-size:15px;cursor:pointer}
#fb{margin-top:8px;font-weight:600}
</style></head><body>
<div class="card" id="app"></div>
<script>
const Q=[
["Your chat shows the full discussion, but the model's current input contains only recent messages. It forgets the first deadline; which simple repair gives it that deadline again?",["Keep the deadline visible by scrolling to the old message.","Repeat its latest answer so the old deadline returns.","Ask it to recall the first message without adding context.","Put the verified deadline into the next request."],3],
["AI says the v4 timeout defaults to 30 seconds; your v4 with default settings stops after 5 seconds. Where should you check the value for your design?",["Read the v4 docs or inspect the default in the running library.","Trust AI's value; look for a fault in the test environment.","Ask AI which version it meant; use the number from that reply.","Switch library versions until the observed timeout matches AI's design notes."],0],
["The same model writes different subject lines from one unchanged prompt in fresh chats. Memory and tools are off; which explanation fits without assuming the prompt changed?",["A repeated subject line would prove every other version is wrong.","Generation can select different continuations on repeated runs.","The prompt must have changed because identical text fixes the reply.","Each new chat updates the model with the previous subject line."],1],
["Two texts have the same word count, but one exceeds the chat's token limit and loses its ending. Why does a word-count check fail to predict this?",["The missing ending shows the model deliberately skipped the topic.","The chat display counts words, so either text must fit equally.","Words can split into different numbers of model tokens.","The model reserves the same number of tokens for every word."],2],
["AI summarises a saved log from a tool preview and reports no warnings; the complete file contains warnings outside that preview. Which check best locates the evidence gap?",["Compare the returned preview's scope with the full saved log.","Use the short final answer as evidence that the complete log was checked.","Ask for another summary of the same preview to recover unseen lines.","Treat a returned file path as proof that every line reached the model."],0],
["A document fits within the input cap, but AI misses an exception in its middle. Moving the same exception to the end improves the answer; which cause does that comparison support?",["The improved answer proves the model uses every supplied fact correctly.","Moving the exception permanently retrained the model on that rule.","The exception was cut from the original input because it exceeded capacity.","The position of supplied information can affect its use."],3],
["AI completes six dependent steps, and the final list is wrong although each step sounds reasonable. Why is checking the earlier handoffs useful before asking for a new final list?",["Repeating the last step removes errors from all prior steps.","Later steps can carry forward an error from an earlier output.","Six generated steps average out each other's mistakes.","A fluent final list makes each earlier step independently valid."],1],
["AI finishes a summary with real citations, but those pages describe an old policy. The current policy is available; why can a cited summary still be wrong?",["More citations to the old policy would make the summary reliable.","A working citation means the policy must still be current.","A clearer prompt changes the date of the retrieved source.","Retrieval can supply real sources unsuitable for today's task."],3],
["AI fills your tracker table in the exact layout you requested, with no empty cells. You gave it no task dates, but it supplies dates anyway; what should you check before using the table?",["Use it because every required column is filled.","Check the layout once more; filled date cells meet the format rule.","Check the dates against the source; layout does not verify them.","Ask AI to confirm the dates; keep them if it repeats the same values."],2],
["AI chat returns your full customer email after a date change, but other text changes too. What should you check before using it?",["Compare the whole reply with your original email.","Ask for another reply; check that the new date is right.","Read the date sentence; look through the rest for changes.","Get three replies; use the one that looks most like your original."],0],
["In a fresh chat, AI follows rules at the start and end of your long prompt but misses rules in its middle. The whole prompt fits; how should you arrange the key output rules?",["Keep them in the middle; use capital letters to show priority.","Place a short reminder of the key rules at the end.","Use a larger input limit so every part of this prompt fits.","Keep their positions; repeat the whole prompt in the same chat."],1],
["You upload two readable reports with vague filenames and ask for the sales figures. AI uses marketing figures instead; which revision most directly tests the source selection?",["Accept the figures because one uploaded report contains them.","Upload both reports again with the same names and wording.","Ask for a shorter answer and retain the same ambiguous source descriptions.","Name the reports clearly and identify the sales source in the request."],3],
["AI (no tools) puts a customer email in the wrong group. Asked why, it says one word in the email caused it. You change your prompt based on that, but the error remains. How should you test whether that word really caused it?",["Ask AI to explain its choice in more detail, then rewrite the prompt using that explanation.","Ask the same question twice more and use the reason that appears in both answers.","Make a copy of the email with only that word changed, then rerun the exact same request.","Rewrite the email group rules around the word AI named, then try the email again."],2],
["AI chat gives wrong totals from your uploaded spreadsheet; it has a tool that can run code. What should you ask next?",["Show each sum in writing, with the steps used to reach it.","Use the code tool to calculate from my uploaded file.","Use a stronger model to calculate the totals again.","Check each number twice, then write the totals again."],1],
["AI selects a lookup tool because its description sounds right, but the returned fields concern archived records. What should you check before using its answer for current records?",["Whether a longer tool description makes the generated answer clearer.","Whether the answer sounds consistent with the tool's advertised purpose.","Whether asking the same question again produces the same values.","The tool's scope, call inputs and returned record fields."],3],
["On a personal AI account with training allowed, you paste a ticket containing client names and phone numbers. You report the slip, then ask the AI to forget it, and it replies 'Deleted.' What does that reply tell you about the data you sent?",["The service has removed the data, since the AI confirmed it was deleted.","Nothing reliable; the data may still be stored and could be used in later training.","Deleting this chat now will cancel any later use of the pasted data.","Turning training off now makes the earlier paste safe to leave in the chat."],1],
["Your weekly AI compliance list shifts consistently for two weeks on the same prompt and 50 test documents. Repeated fresh chats, with memory and personalisation off, agree; what should you check before trusting it?",["Rewrite the prompt because repeated use weakens it.","Run more fresh chats to test whether the change is random.","Keep correcting replies so the model learns the expected answers.","Check the model version and retest the saved documents."],3],
["After AI completes an approved task, you notice confidential material entered a training-enabled account by mistake. Why should you preserve evidence and report promptly rather than privately clearing the chat?",["Chat deletion does not establish reversal of model training use.","A later opt-out guarantees the earlier input was never used.","Waiting for AI to admit a leak will confirm whether reporting is needed.","A clean chat display proves that no other data path existed."],0],
["AI-completed packs now get faster approvals and fewer review notes, while spot-checks find more missed errors. Which interpretation should you test before calling the workflow more efficient?",["A stronger confidence phrase would make the spot-check findings irrelevant.","Reviewers may be treating fluent all-clear claims as accuracy evidence.","Faster approval proves that the model has become more accurate.","Fewer comments prove that every remaining issue is only cosmetic."],1],
["AI completes a sharing plan and marks its own permission review approved; no authorised person decided. What should you verify before accepting the completed result?",["Treat successful preparation of the output as permission to share it.","Accept the generated approval because the plan lists permission risks.","Obtain the authorised human's decision on the proposed sharing scope.","Ask another AI to approve the same scope without a human decision."],2],
["AI completes your `import` line with a package called `requests-easyauth` and writes code using it. The install fails — no such package exists. What most likely happened?",["It was recently renamed; search the registry for the new name and install that.","The model invented a real-looking name that was never published.","Your package index is misconfigured; point it at a working mirror and retry.","It is too new to be indexed yet, so install it directly from source."],1],
["AI describes `parseOrder(currency)` after searching your workspace; you supplied no file, and none is open in its editor. Your review page shows `parseOrder(id)` and another module shares the name; what should you do?",["Apply the suggested fix; the extra parameter may be an overload.","Say the reply is wrong; ask with the same name.","Rebuild workspace search and repeat the same question by name.","Attach the exact file; compare the new reply with its code."],3],
["A helper explores many files for your bug fix and returns every opened passage. The main chat hits its input cap before coding; which handoff change best preserves useful context?",["Split the same passages across messages in the main conversation.","Return relevant paths and findings, with links to the larger evidence.","Ask the main model to write less after all passages are loaded.","Keep full helper transcripts because their separate origin makes them free."],1],
["AI implements a validation bypass mentioned inside pasted test-fixture text, although your request was only to diagnose a failing test. What should you check before using its patch?",["Whether fixture content was treated as an instruction rather than data.","Whether the bypass makes the failing assertion green.","Whether repeating the fixture makes its requested bypass more consistent.","Whether a newer model writes the same bypass with cleaner code."],0],
["AI says a fix is done and tests passed, but provides no test command or result. Before accepting the draft, what would turn that assurance into useful evidence?",["Ask AI to express a more precise confidence percentage.","Use the length of the implementation explanation as the test evidence.","Inspect or run the relevant tests and compare their actual results.","Accept the assertion if the same model repeats it twice."],2],
["You asked AI for a login fix, but several cleanup turns later it keeps expanding a formatting change instead. What should you compare before accepting its next patch?",["The generated task branch against the approved login objective.","The latest confident progress message with its previous message.","The patch size with a larger model's suggested patch size.","The formatting of successive cleanup patches with one another."],0],
["Your coding assistant cites a real file for an auth fix, but the cited function belongs to another service. The correct service is available; which check best tests the proposed fix?",["Accept the fix because the cited file exists in the repository.","Match the cited symbol and owning service to the actual failing path.","Ask for more code from the same cited function.","Refresh the model without checking which service supplied the context."],1],
["AI's docs search returns a complete example, yet three fresh chats repeat the same failing call. With project, task and model unchanged, adding your pinned version's example fixes it; which check best tests why the normal draft fails?",["Upgrade the dependency to the latest release.","Try fresh chats with the same sample; accept two matching fixes.","Use a stronger model and keep the same retrieved example.","Compare that example with docs for your pinned version."],3],
["AI finishes a patch after repeated broad file searches, but an early requirement fell outside the last call's input. You know the relevant files; which next-run change most directly reduces that loss?",["Add another recap without limiting the same repeated file searches.","Compare total billed tokens with the limit as if they were one window.","Supply the verified paths and requirement before focused exploration.","Ask for shorter final code while keeping all broad search output."],2],
["AI finishes two test-description sets on the same code and prompt, even using the least-variable setting. Their wording differs; what should you examine before treating this as a code regression?",["Whether required behaviours changed, rather than exact generated wording.","Whether the first generated description is the permanent expected string.","Whether matching wording can be forced by repeating the last run.","Whether lower variation settings prove that every output must be identical."],0]
];
let i=0,score=0,done=false;
const app=document.getElementById("app");
function show(){
  if(i>=Q.length){
    app.innerHTML=`<h2>Finished</h2><p>Score: <b>${score}/${Q.length}</b> (${Math.round(score/Q.length*100)}%)</p><button id="restart">Restart</button>`;
    document.getElementById("restart").onclick=()=>{i=0;score=0;show()};return;
  }
  const [t,o,a]=Q[i];done=false;
  app.innerHTML=`<div class="top"><span>Question ${i+1}/${Q.length}</span><span>Score: ${score}</span></div>
  <div class="bar"><div style="width:${i/Q.length*100}%"></div></div>
  <p><b>${t}</b></p>
  ${o.map((x,k)=>`<button class="opt" data-k="${k}">${"ABCD"[k]}. ${x}</button>`).join("")}
  <div id="fb"></div><button id="next" style="display:none">${i==Q.length-1?"Finish":"Next"}</button>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(done)return;done=true;
    const k=+b.dataset.k;
    app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===a)x.classList.add("ok")});
    const fb=document.getElementById("fb");
    if(k===a){score++;fb.textContent="✅ Correct!";fb.style.color="#2e9e5b"}
    else{b.classList.add("bad");fb.textContent="❌ Wrong. Correct answer: "+"ABCD"[a]+". "+o[a];fb.style.color="#d33"}
    const n=document.getElementById("next");n.style.display="inline-block";n.onclick=()=>{i++;show()};
  });
}
show();
</script></body></html>
